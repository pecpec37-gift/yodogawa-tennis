<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4b5c">
<title>淀川河川敷テニスコート 空き状況</title>
<style>
  :root {
    --header: #1d4b5c;
    --bg: #e6edef;
    --card: #ffffff;
    --card-head: #f4f8f9;
    --line: #dde5e8;
    --text: #17252b;
    --muted: #6b7b82;
    --green: #2e7b4f;
    --gray-chip: #c3ced2;
    --gray-chip-text: #9aa8ae;
    --orange: #c98a2b;
    --orange-text: #a66a12;
    --sat: #2a62b8;
    --sun: #c23a3a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    line-height: 1.4;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  header { background: var(--header); color: #fff; }
  header .wrap { padding: calc(14px + env(safe-area-inset-top)) 16px 10px; }
  h1 { margin: 0; font-size: 21px; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: 13px; color: #c4d6dc; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;
    padding: 5px 12px 5px 9px; border-radius: 999px;
    background: rgba(255,255,255,.14); color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 700;
  }
  .back:active { background: rgba(255,255,255,.28); }
  .back:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .wave { display: block; width: 100%; height: 14px; background: var(--bg); }
  .wave path { fill: var(--header); }

  .controls { padding: 12px 8px 0; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .tabs { flex: 1; display: flex; background: #fff; border-radius: 12px; padding: 4px; }
  .tabs button {
    flex: 1; border: 0; background: none; border-radius: 9px; padding: 10px 0;
    font: inherit; font-weight: 700; font-size: 15px; color: var(--text); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--header); color: #fff; }
  #refresh {
    border: 0; border-radius: 12px; background: var(--green); color: #fff; padding: 0 16px;
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--green);
    margin: 3px;
  }
  #refresh:disabled { opacity: .6; cursor: default; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px 0; font-size: 13px; color: var(--muted); }
  .meta label { display: flex; align-items: center; gap: 5px; color: var(--text); cursor: pointer; }
  .meta input { width: 18px; height: 18px; accent-color: var(--green); margin: 0; }
  .error { margin: 10px 4px 0; padding: 10px 12px; border-radius: 10px; background: #fbeaea; color: #8f2424; font-size: 14px; }

  .legend { display: flex; gap: 16px; align-items: center; margin-top: 12px; padding: 12px 6px; border-top: 1px solid #cfd9dd; font-size: 14px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .chip { width: 26px; height: 22px; font-size: 11px; font-style: italic; flex: none; aspect-ratio: auto; }

  main { padding: 0 8px calc(24px + env(safe-area-inset-bottom)); }
  .day { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
  .day-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 22px; background: var(--card-head); }
  .day-num { font-size: 44px; font-weight: 800; line-height: 1; min-width: 56px; }
  .day-date { font-weight: 700; font-size: 15px; }
  .sat .day-date { color: var(--sat); }
  .sun .day-date { color: var(--sun); }
  .day-sum { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 14px; }
  .day-sum b { color: var(--green); font-size: 16px; }
  .day-sum b.zero { color: var(--gray-chip-text); }
  .day-sum b.lot { color: var(--orange-text); font-size: 14px; }

  .area { border-top: 1px solid var(--line); padding: 10px 14px 6px; }
  .area-head { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--muted); }
  .area-head strong { font-size: 16px; color: var(--text); }
  .area-head b { color: var(--green); }
  .area-head b.lot { color: var(--orange-text); }
  .area-none { font-size: 14px; color: var(--muted); padding: 6px 0 4px; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .slot-time { width: 86px; flex: none; font-weight: 800; font-size: 17px; line-height: 1.35; }
  .chips { flex: 1; display: flex; gap: 6px; min-width: 0; }
  .chip {
    flex: 1 1 0; max-width: 36px; min-width: 0; aspect-ratio: 1; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; line-height: 1;
  }
  .chip.free { background: var(--green); color: #fff; border: 3px solid var(--green); box-shadow: inset 0 0 0 1.5px #fff; }
  .chip.full { border: 1.5px dashed var(--gray-chip); color: var(--gray-chip-text); font-weight: 500; }
  .chip.lot { border: 1.5px solid var(--orange); color: var(--orange-text); }
  .chip small { font-size: 9px; font-weight: 600; margin-top: 2px; }

  .empty { text-align: center; color: var(--muted); padding: 36px 16px; font-size: 15px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 28px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="https://pecpec37-gift.github.io/portal/">← ポータルに戻る</a>
    <h1>淀川河川敷テニスコート 空き状況</h1>
    <p>毛馬・赤川の土日祝</p>
  </div>
  <svg class="wave" viewBox="0 0 400 14" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0H400V6C375 14 350 2 325 7S275 13 250 7 200 2 175 7 125 13 100 7 50 2 25 7 8 10 0 8Z"/>
  </svg>
</header>

<div class="wrap">
  <div class="controls">
    <div class="row">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="0" aria-selected="true">今月</button>
        <button role="tab" data-tab="1" aria-selected="false">来月</button>
      </div>
      <button id="refresh">今すぐチェック</button>
    </div>
    <div class="meta">
      <span id="fetched">取得中…</span>
      <label><input type="checkbox" id="only-free" checked>空きのある日だけ</label>
    </div>
    <div class="error" id="error" hidden></div>
    <div class="legend">
      <span><i class="chip free">1</i>空き</span>
      <span><i class="chip full">1</i>予約済</span>
      <span><i class="chip lot">1</i>抽選</span>
    </div>
  </div>
  <main id="list"></main>
  <footer>データ元: <a href="https://www.yodoikopark.jp/vacancy.html" target="_blank" rel="noopener">淀川河川公園 施設予約システム</a>（予約は公式サイトから）</footer>
</div>

<script>
// ▼▼▼ ここを GAS のウェブアプリURL (https://script.google.com/macros/s/…/exec) に差し替える ▼▼▼
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx5ArFq7gdLoaNKNA3SZGSGS6INwAmZOGN6PigRTT1WuHFwgMndVUW2Hv4gTj48p9baUg/exec';
// ▲▲▲ 差し替えるのはこの1行だけ ▲▲▲

const $ = (id) => document.getElementById(id);
const store = {
  get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* 保存できなくても動作に支障なし */ } },
};

const months = [null, null]; // 月ごとの取得結果 (0=今月 1=来月)。タブを開いたときに取得する
const loading = [false, false];
let tab = Number(store.get('tab', '0')) === 1 ? 1 : 0;
$('only-free').checked = store.get('onlyFree', '1') === '1';

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const hhmm = (h) => `${h}:00`;
const count = (area, status) =>
  (area.slots ?? []).reduce((n, s) => n + s.courts.filter((c) => c.status === status).length, 0);

function renderArea(area, onlyFree) {
  const free = count(area, '空');
  const lot = count(area, '抽');
  const box = el('section', 'area');
  const head = el('div', 'area-head');
  head.append(el('strong', null, area.name), el('span', null, `${area.courts}面`));
  if (lot && !free) {
    const s = el('span', null, '抽選 ');
    s.append(el('b', 'lot', lot), ' 枠');
    head.append(s);
  } else {
    const s = el('span', null, '空き ');
    s.append(el('b', null, free), ' 枠');
    head.append(s);
  }
  box.append(head);

  if (!area.slots) {
    box.append(el('div', 'area-none', area.cal === '満' ? '空きなし（全枠予約済）' : '受付対象外'));
    return box;
  }
  for (const slot of area.slots) {
    if (onlyFree && !slot.courts.some((c) => c.status === '空')) continue;
    const row = el('div', 'slot');
    const time = el('div', 'slot-time');
    time.append(`${hhmm(slot.from)}–`, el('wbr'), hhmm(slot.to));
    const chips = el('div', 'chips');
    for (const c of slot.courts) {
      const kind = c.status === '空' ? 'free' : c.status === '抽' ? 'lot' : 'full';
      const chip = el('span', `chip ${kind}`, c.no);
      const label = { free: '空き', lot: `抽選（申込 ${c.bairitu} 件）`, full: '予約済' }[kind];
      chip.setAttribute('aria-label', `${c.no}番コート ${label}`);
      if (kind === 'lot') chip.append(el('small', null, `×${c.bairitu}`));
      chips.append(chip);
    }
    row.append(time, chips);
    box.append(row);
  }
  return box;
}

function render() {
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(Number(b.dataset.tab) === tab));
  const month = months[tab];
  const btn = $('refresh');
  btn.disabled = loading[tab];
  btn.textContent = loading[tab] ? '取得中…' : '今すぐチェック';
  $('fetched').textContent = month ? fetchedLabel(month) : loading[tab] ? '取得中…' : '未取得';
  const list = $('list');
  if (!month) {
    list.replaceChildren(loading[tab] ? el('div', 'empty', '予約サイトから取得しています…') : '');
    return;
  }
  const onlyFree = $('only-free').checked;
  list.replaceChildren();

  let lotteryDays = 0;
  for (const day of month.days) {
    const frees = day.areas.map((a) => count(a, '空'));
    const hasFree = frees.some((n) => n > 0);
    if (!hasFree && day.areas.some((a) => a.cal === '抽')) lotteryDays++;
    if (onlyFree && !hasFree) continue;

    const card = el('article', `day ${day.dow === '土' && !day.holiday ? 'sat' : 'sun'}`);
    const head = el('div', 'day-head');
    const info = el('div');
    info.append(el('div', 'day-date', `${day.month}月${day.day}日（${day.dow}${day.holiday ? '・祝' : ''}）`));
    const sum = el('div', 'day-sum');
    sum.append(el('span', null, '空き'));
    day.areas.forEach((a, i) => {
      const s = el('span', null, `${a.name} `);
      s.append(a.cal === '抽' && !frees[i] ? el('b', 'lot', '抽選') : el('b', frees[i] ? null : 'zero', frees[i]));
      sum.append(s);
    });
    info.append(sum);
    head.append(el('div', 'day-num', day.day), info);
    card.append(head);
    day.areas.forEach((a, i) => {
      if (onlyFree && !frees[i]) return;
      card.append(renderArea(a, onlyFree));
    });
    list.append(card);
  }

  if (!list.children.length) {
    const msg = !month.days.length
      ? `${month.month}月の残りに土日祝はありません`
      : `${month.month}月の土日祝に空きはありません` + (lotteryDays ? `\n（抽選受付中の日が ${lotteryDays} 日あります。チェックを外すと表示されます）` : '');
    const box = el('div', 'empty', msg);
    box.style.whiteSpace = 'pre-line';
    list.append(box);
  }
}

function fetchedLabel(month) {
  const d = new Date(month.fetchedAt);
  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} 取得`;
}

// GAS は別オリジンなので JSONP (scriptタグ) で呼ぶ
function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = `__yodo_${Date.now()}_${Math.floor(Math.random() * 1e6)}`;
    const script = document.createElement('script');
    const cleanup = () => {
      clearTimeout(timer);
      script.remove();
      delete window[cb];
    };
    const timer = setTimeout(() => {
      cleanup();
      window[cb] = () => delete window[cb]; // 遅れて届いた応答は捨てる
      reject(new Error('応答がありません（タイムアウト）'));
    }, timeoutMs);
    window[cb] = (body) => {
      cleanup();
      resolve(body);
    };
    script.onerror = () => {
      cleanup();
      reject(new Error('GASに接続できません。GAS_URL とデプロイ設定（アクセス: 全員）を確認してください'));
    };
    script.src = `${url}${url.includes('?') ? '&' : '?'}callback=${cb}`;
    document.head.append(script);
  });
}

// quiet: 裏での先読み用。失敗しても画面にエラーを出さない
async function load(m, force, quiet) {
  if (loading[m]) return;
  loading[m] = true;
  if (!quiet) $('error').hidden = true;
  render();
  try {
    if (!GAS_URL.startsWith('https://script.google.com/')) throw new Error('index.html 冒頭の GAS_URL が未設定です');
    const body = await jsonp(`${GAS_URL}?month=${m}` + (force ? '&force=1' : ''), 120000);
    if (body.error) throw new Error(body.error);
    months[m] = body;
  } catch (err) {
    if (!quiet) {
      $('error').textContent = `${m ? '来月' : '今月'}分の取得に失敗しました: ${err.message}`;
      $('error').hidden = false;
    }
  } finally {
    loading[m] = false;
    render();
  }
  // 来月分は取得に時間がかかるので、今月が取れたら裏で先に取っておく
  if (m === 0 && months[0] && !months[1]) load(1, false, true);
}

for (const b of document.querySelectorAll('.tabs button')) {
  b.addEventListener('click', () => {
    tab = Number(b.dataset.tab);
    store.set('tab', String(tab));
    render();
    if (!months[tab]) load(tab, false);
  });
}
$('only-free').addEventListener('change', (e) => {
  store.set('onlyFree', e.target.checked ? '1' : '0');
  render();
});
$('refresh').addEventListener('click', () => load(tab, true));

render();
load(tab, false);
</script>
</body>
</html>
